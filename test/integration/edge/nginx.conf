# UAT edge reverse proxy — sealed local-docker UAT for llm-gateway
# Listens on 8080, reverse-proxies all traffic to gateway:8787.
# No external resolver, no upstream block, no app secrets.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Disable access buffering for streaming LLM responses
    proxy_buffering         off;
    proxy_request_buffering off;

    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass         http://gateway:8787;
            proxy_http_version 1.1;

            # Preserve original host and protocol headers
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Keep connections alive for streaming
            proxy_set_header   Connection        "";
        }
    }
}
