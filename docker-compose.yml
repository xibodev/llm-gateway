# Local / single-box deployment for the LLM gateway (Go).
#
#   LLMGW_API_KEY=... docker compose up -d --build
#
# The gateway handles bearer auth itself (LLMGW_API_KEY). Put a real config at
# ./config.local.yaml (see llmgw.config.example.yaml) — it is mounted read-only.
# The named volume persists gateway state (IAM db, encrypted connections,
# hashed and encrypted keys, usage, catalog, Copilot OAuth token cache).
#
# The image is distroless/nonroot (uid 65532); state lives at /state rather
# than a home directory so the container can own it.
#
# For TLS + a real box, use deploy/docker-compose.prod.yml instead.
#
# NOTE: the published host port is env-driven so it does not squat a fixed port.

services:
  gateway:
    build:
      context: ./go
    image: llm-gateway-go:local
    environment:
      LLMGW_HOST: 0.0.0.0
      LLMGW_PORT: "8787"
      LLMGW_STATE_DIR: /state
      LLMGW_CONFIG: /state/config.yaml
      LLMGW_CONFIG_SEED: /config/llmgw.config.yaml
      LLMGW_API_KEY: ${LLMGW_API_KEY:-}
      LLMGW_ALLOW_UNAUTHENTICATED_API: ${LLMGW_ALLOW_UNAUTHENTICATED_API:-0}
      LLMGW_ADMIN_KEYS_ON_DATA_PLANE: ${LLMGW_ADMIN_KEYS_ON_DATA_PLANE:-true}
      LLMGW_GOOGLE_ANTIGRAVITY_CLIENT_ID: ${LLMGW_GOOGLE_ANTIGRAVITY_CLIENT_ID:-}
      LLMGW_GOOGLE_ANTIGRAVITY_CLIENT_SECRET: ${LLMGW_GOOGLE_ANTIGRAVITY_CLIENT_SECRET:-}
      LLMGW_GOOGLE_ANTIGRAVITY_OAUTH_PROFILE: ${LLMGW_GOOGLE_ANTIGRAVITY_OAUTH_PROFILE:-}
      LLMGW_GOOGLE_ANTIGRAVITY_CLIENT_MODE: ${LLMGW_GOOGLE_ANTIGRAVITY_CLIENT_MODE:-}
      LLMGW_GOOGLE_ANTIGRAVITY_REDIRECT_URI: ${LLMGW_GOOGLE_ANTIGRAVITY_REDIRECT_URI:-}
      LLMGW_OAUTH_PUBLIC_BASE_URL: ${LLMGW_OAUTH_PUBLIC_BASE_URL:-}
      LLMGW_CREDENTIAL_ENCRYPTION_KEY: ${LLMGW_CREDENTIAL_ENCRYPTION_KEY:-}
      LLMGW_GITHUB_COPILOT_CACHE_DIR: /state/cache
      LLMGW_EXTENSION_URL: ${LLMGW_EXTENSION_URL:-}
      LLMGW_EXTENSION_SECRET: ${LLMGW_EXTENSION_SECRET:-}
      LLMGW_RETENTION_USAGE_DAYS: ${LLMGW_RETENTION_USAGE_DAYS:-90}
      LLMGW_RETENTION_AUDIT_DAYS: ${LLMGW_RETENTION_AUDIT_DAYS:-365}
      LLMGW_RETENTION_DELIVERED_OUTBOX_DAYS: ${LLMGW_RETENTION_DELIVERED_OUTBOX_DAYS:-400}
      LLMGW_BACKUP_KEEP: ${LLMGW_BACKUP_KEEP:-7}
      LLMGW_PROVIDER_ROSTER_URL: ${LLMGW_PROVIDER_ROSTER_URL:-https://xibodev.github.io/llm-gateway/roster/payload.json}
      LLMGW_PROVIDER_ROSTER_AUTO_REFRESH: ${LLMGW_PROVIDER_ROSTER_AUTO_REFRESH:-true}
      LLMGW_ANONYMOUS_PROVIDER_AUTOMATION: ${LLMGW_ANONYMOUS_PROVIDER_AUTOMATION:-false}
      LLMGW_ACCESS_LOG: ${LLMGW_ACCESS_LOG:-}
      LLMGW_METRICS_TOKEN: ${LLMGW_METRICS_TOKEN:-}
      LLMGW_RATE_LIMIT_PER_MINUTE: ${LLMGW_RATE_LIMIT_PER_MINUTE:-0}
    volumes:
      - ./config.local.yaml:/config/llmgw.config.yaml:ro
      - llmgw-state:/state
    ports:
      # LLMGW_HOST_PORT is the host side of this mapping, address:port, and
      # publishes on loopback by default. To expose the gateway deliberately,
      # give it the address of the interface to publish on, such as
      # 0.0.0.0:8787 for every interface, and put TLS in front of it (see
      # Caddyfile). A port without an address also publishes on every interface.
      - "${LLMGW_HOST_PORT:-127.0.0.1:8787}:8787"
    # Lets the gateway reach a host-side Ollama (auto-detected at startup) at
    # http://host.docker.internal:11434. Harmless when no host Ollama is running.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Outlasts the gateway's shutdown drain (LLMGW_SHUTDOWN_TIMEOUT_SECONDS,
    # default 25), so a stop does not kill it mid-drain.
    stop_grace_period: 30s

volumes:
  llmgw-state:
