# Build and publish the Go gateway image to GHCR on a version tag.
#
#   git tag v0.1.0 && git push origin v0.1.0
#     -> ghcr.io/<owner>/llm-gateway:0.1.0  (+ :latest)
#
# The Go build is a static distroless image for linux/amd64 and linux/arm64
# (see go/Dockerfile). Pure Go means no cross-compilation toolchain is needed.
#
# Publishing is gated on ci.yml: the image job will not run unless the Go and
# console suites pass on the tagged commit.
name: release-image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache-dependency-path: go/go.sum

      - name: Test and vet
        working-directory: go
        run: |
          go test ./...
          go vet ./...

      - name: Scan Go vulnerabilities
        working-directory: go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: go
          file: go/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
