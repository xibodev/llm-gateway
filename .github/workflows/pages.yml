name: pages

on:
  push:
    branches: [main]
    paths:
      - website/**
      - brand/**
      - docs/**
      - go/internal/providers/registry_snapshot.json
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - scripts/check-docs.mjs
      - scripts/build-website.mjs
      - scripts/render-brand-assets.mjs
      - scripts/provider-roster-community/baseline.mjs
      - scripts/provider-roster-community/github.mjs
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - website/**
      - brand/**
      - docs/**
      - go/internal/providers/registry_snapshot.json
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - scripts/**
      - .github/workflows/pages.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Reads the provider roster workflow's runs and downloads its artifact.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"

      - name: Validate and build static site
        run: |
          node --check website/site.js
          node --check scripts/check-docs.mjs
          node --check scripts/build-website.mjs
          node --check scripts/render-brand-assets.mjs
          node scripts/render-brand-assets.mjs --check
          node scripts/build-website.mjs

      # Every installation fetches roster/payload.json from this site, so a
      # website deployment republishes the newest roster instead of wiping it.
      # Without one it deploys anyway, with a warning; a lookup error fails.
      - name: Find the newest published provider roster
        id: roster
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/provider-roster-community/baseline.mjs --published

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.roster.outputs.found == 'true'
        with:
          name: provider-roster-staging
          path: published-roster
          github-token: ${{ github.token }}
          run-id: ${{ steps.roster.outputs.run_id }}

      - name: Include the provider roster
        if: steps.roster.outputs.found == 'true'
        run: |
          mkdir -p .website-dist/roster
          cp published-roster/payload.json .website-dist/roster/payload.json
          # Optional, as in the roster workflow's own deployment.
          if [ -f published-roster/report.json ]; then
            cp published-roster/report.json .website-dist/roster/report.json
          fi

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          path: .website-dist

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Shared with the roster workflow's deployment so the two never interleave.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
