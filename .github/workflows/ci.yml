# Build, vet and test the Go gateway and its embedded console.
#
# Also callable from release.yml, so a version tag cannot publish artifacts
# without these jobs passing first.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: {}

permissions:
  contents: read

# A new push to a pull request cancels its running checks; runs on main are
# never cancelled once started. A called workflow sees its caller's name in
# github.workflow, so release.yml's run gets its own group instead of
# queueing behind, or being replaced by, a main-branch run of the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: go build / vet / test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build
        working-directory: go
        run: go build ./...

      - name: Vet
        working-directory: go
        run: go vet ./...

      - name: Staticcheck
        working-directory: go
        # Pinned to release 2026.2.1, so a new release cannot fail an unchanged
        # tree; go/staticcheck.conf selects the checks.
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Test
        working-directory: go
        # The suite is hermetic: an unreachable proxy fails any test that
        # reaches the internet, while loopback test servers are never proxied.
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: go test ./...

      - name: Race-test every package
        working-directory: go
        # Requests share state across goroutines, such as settings read
        # without a lock while writers publish new copies. The race detector
        # needs cgo, which the release builds leave off, and slows tests
        # several times over, hence the longer per-package timeout.
        timeout-minutes: 30
        env:
          CGO_ENABLED: "1"
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: go test -race -timeout 20m ./...

      - name: Vulnerability scan
        working-directory: go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...

  # The release also ships Windows and macOS binaries. These packages hold the
  # code that differs by OS (state-file locking, private permissions and ACLs,
  # durable renames, shutdown signals); the go job runs the whole suite on Linux.
  go-platforms:
    name: go test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false

      # The test step blocks the network, so the modules it builds against
      # are fetched first, as the go job's build step fetches them.
      - name: Download modules
        working-directory: go
        run: go mod download

      - name: Test platform-specific packages
        working-directory: go
        # Hermetic, as in the go job: an unreachable proxy fails any test that
        # reaches the internet.
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: go test ./cmd/... ./internal/operations/... ./internal/config/... ./internal/iam/...

  cross-compile:
    name: go cross-compile / release targets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Build every release target
        working-directory: go
        # Every target the binaries job in release.yml ships; keep the two lists
        # in step. A target that stops compiling then fails its pull request
        # rather than the release.
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 freebsd/amd64 linux/riscv64; do
            echo "build $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/llmgw
          done

  console:
    name: console lint / test / dist
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: go/internal/web/console/package-lock.json

      - name: Install
        working-directory: go/internal/web/console
        run: npm ci

      - name: Typecheck
        working-directory: go/internal/web/console
        run: npm run lint

      - name: Test
        working-directory: go/internal/web/console
        run: npm test

      - name: Dependency audit
        working-directory: go/internal/web/console
        run: npm audit --audit-level=high

      # dist/ is committed because the Go binary embeds it. This rebuilds and
      # fails if the committed bundle has drifted from source — otherwise a
      # `go build` can ship a console nobody can trace back to a commit.
      - name: Verify committed dist matches source
        working-directory: go/internal/web/console
        run: npm run check:dist

  workflow:
    name: workflow / container validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"

      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Validate container definition
        run: docker buildx build --check --file go/Dockerfile go

      - name: Validate documentation and website
        run: node scripts/check-docs.mjs

      - name: Validate live-acceptance policy core
        working-directory: test/live-acceptance
        run: npm test

      - name: Validate provider roster scripts
        run: node --test scripts/provider-roster/*.test.mjs scripts/provider-roster-community/*.test.mjs

      - name: Install pinned release tooling
        working-directory: .github/release-harness
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate release-harness contracts and lifecycle
        env:
          RELEASE_HARNESS: ${{ github.workspace }}/.github/release-harness/node_modules/.bin/release-harness
        run: |
          "$RELEASE_HARNESS" validate --all
          "$RELEASE_HARNESS" lifecycle check

  deterministic-acceptance:
    name: deterministic Docker acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: test/live-acceptance/package-lock.json

      - name: Initialize failure report
        env:
          LLMGW_ACCEPTANCE_MODE: deterministic
          LLMGW_ACCEPTANCE_REPORT: ${{ github.workspace }}/test/live-acceptance/report.deterministic.json
        run: node test/live-acceptance/bootstrap-report.mjs

      - name: Install pinned harness and browser
        working-directory: test/live-acceptance
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run clean-state deterministic acceptance
        env:
          LLMGW_ACCEPTANCE_MODE: deterministic
          LLMGW_ACCEPTANCE_REPORT: ${{ github.workspace }}/test/live-acceptance/report.deterministic.json
          LLMGW_ACCEPTANCE_PORT: "18810"
        run: node test/live-acceptance/run.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: deterministic-acceptance-${{ github.sha }}
          path: test/live-acceptance/report.deterministic.json
          if-no-files-found: error
          retention-days: 14
