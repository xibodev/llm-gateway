# Build, vet and test the Go gateway and its embedded console.
#
# Also callable from release.yml, so a version tag cannot publish artifacts
# without these jobs passing first.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call: {}

permissions:
  contents: read

jobs:
  go:
    name: go build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.6
          cache-dependency-path: go/go.sum

      - name: Build
        working-directory: go
        run: go build ./...

      - name: Vet
        working-directory: go
        run: go vet ./...

      - name: Test
        working-directory: go
        run: go test ./...

      - name: Vulnerability scan
        working-directory: go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...

  console:
    name: console lint / test / dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: go/internal/web/console/package-lock.json

      - name: Install
        working-directory: go/internal/web/console
        run: npm ci

      - name: Typecheck
        working-directory: go/internal/web/console
        run: npm run lint

      - name: Test
        working-directory: go/internal/web/console
        run: npm test

      - name: Dependency audit
        working-directory: go/internal/web/console
        run: npm audit --audit-level=high

      # dist/ is committed because the Go binary embeds it. This rebuilds and
      # fails if the committed bundle has drifted from source — otherwise a
      # `go build` can ship a console nobody can trace back to a commit.
      - name: Verify committed dist matches source
        working-directory: go/internal/web/console
        run: npm run check:dist

  workflow:
    name: workflow / container validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.6
          cache: false

      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Validate container definition
        run: docker buildx build --check --file go/Dockerfile go
