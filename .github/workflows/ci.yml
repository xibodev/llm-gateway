# Build, vet and test the Go gateway and its embedded console.
#
# Also callable from release-image.yml, so a version tag cannot publish an
# image without these jobs passing first.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call: {}

permissions:
  contents: read

jobs:
  go:
    name: go build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache-dependency-path: go/go.sum

      - name: Build
        working-directory: go
        run: go build ./...

      - name: Vet
        working-directory: go
        run: go vet ./...

      - name: Test
        working-directory: go
        run: go test ./...

  console:
    name: console lint / test / dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: go/internal/web/console/package-lock.json

      - name: Install
        working-directory: go/internal/web/console
        run: npm ci

      - name: Typecheck
        working-directory: go/internal/web/console
        run: npm run lint

      - name: Test
        working-directory: go/internal/web/console
        run: npm test

      # dist/ is committed because the Go binary embeds it. This rebuilds and
      # fails if the committed bundle has drifted from source — otherwise a
      # `go build` can ship a console nobody can trace back to a commit.
      - name: Verify committed dist matches source
        working-directory: go/internal/web/console
        run: npm run check:dist
